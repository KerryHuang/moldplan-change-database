name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: 建置與測試
    runs-on: windows-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 還原相依套件
        run: |
          dotnet restore src/MoldplanDbSwitcher/MoldplanDbSwitcher.csproj
          dotnet restore tests/MoldplanDbSwitcher.Tests/MoldplanDbSwitcher.Tests.csproj

      - name: 建置
        run: dotnet build src/MoldplanDbSwitcher/MoldplanDbSwitcher.csproj --configuration Release --no-restore

      - name: 執行測試
        run: dotnet test tests/MoldplanDbSwitcher.Tests/MoldplanDbSwitcher.Tests.csproj --configuration Release --no-restore --verbosity normal
